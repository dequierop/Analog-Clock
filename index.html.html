<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>นาฬิกาเข็ม · Analog Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap">
<style>
:root{--bg:#eaf4f2;--panel:#fff;--ink:#1f3a3d;--mut:#5c7a7d;--line:#c9dcda;--face:#fffdf6;--hour:#1f3a3d;--min:#e0603f;--acc:#2a8c82;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14262a;--panel:#1d3439;--ink:#eaf4f2;--mut:#9dbcbc;--line:#2f4c52;--face:#f6f1e3;--hour:#1f3a3d;--min:#e0603f;--acc:#4fc1b4;--accink:#0f2427}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mali","Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px}
h1{font-size:1.4rem;margin:0}
.credit{font-size:.8rem;font-weight:600;color:var(--mut);white-space:nowrap}
.lang button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;cursor:pointer}
.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0}
.lang button[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
main{display:grid;grid-template-columns:minmax(280px,1.3fr) minmax(280px,1fr);gap:20px;padding:0 20px 28px;max-width:1100px;margin:0 auto}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
svg{width:100%;height:auto;max-height:78vh;display:block;touch-action:none;user-select:none}
.hint{color:var(--mut);font-size:.85rem;text-align:center;margin:6px 0 0}
h2{font-size:1.05rem;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:2px}
input[type=number],select{font:inherit;font-size:1.3rem;width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
select{width:auto;font-size:1rem}
.colon{font-size:1.6rem;align-self:flex-end;padding-bottom:4px}
button.b{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--acc);color:var(--accink)}
button.b.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--min);outline-offset:2px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.95rem}
.ans{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;text-align:center}
.big{font-size:3rem;font-weight:700;letter-spacing:.04em;line-height:1.1}
.say{font-size:1.15rem;color:var(--mut);min-height:1.7em}
</style>
</head>
<body>
<header>
  <h1><span id="t_title"></span> <small class="credit">by KRUPOY</small></h1>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="th">ไทย</button><button data-l="en">EN</button><button data-l="zh">中文</button>
  </div>
</header>
<main>
  <section class="card">
    <svg id="clock" viewBox="0 0 400 400" role="img" aria-label="clock">
      <circle cx="200" cy="200" r="190" fill="var(--face)" stroke="var(--hour)" stroke-width="8"/>
      <g id="ticks"></g><g id="nums"></g><g id="mnums"></g>
      <g id="hh" style="cursor:grab"><line x1="200" y1="215" x2="200" y2="120" stroke="var(--hour)" stroke-width="14" stroke-linecap="round"/></g>
      <g id="mh" style="cursor:grab"><line x1="200" y1="220" x2="200" y2="50" stroke="var(--min)" stroke-width="8" stroke-linecap="round"/></g>
      <circle cx="200" cy="200" r="11" fill="var(--hour)"/>
    </svg>
    <p class="hint" id="t_hint"></p>
  </section>
  <section class="card">
    <h2 id="t_set"></h2>
    <div class="row">
      <label><span id="t_h"></span><input id="inH" type="number" min="1" max="12" value="3"></label>
      <span class="colon">:</span>
      <label><span id="t_m"></span><input id="inM" type="number" min="0" max="59" value="0"></label>
      <button class="b" id="btnSet"></button>
    </div>
    <h2 id="t_rand"></h2>
    <div class="row">
      <label><span id="t_lvl"></span>
        <select id="lvl"></select></label>
      <button class="b alt" id="btnRand" style="align-self:flex-end"></button>
    </div>
    <label class="chk"><input type="checkbox" id="showMin" checked><span id="t_showmin"></span></label>
    <div class="ans">
      <button class="b" id="btnAns"></button>
      <div class="big" id="digital" aria-live="polite">?</div>
      <div class="say" id="say"></div>
    </div>
  </section>
</main>
<script>
const T={
th:{title:"อ่านเวลาจากนาฬิกาเข็ม",hint:"ลากเข็มสั้น (ชั่วโมง) หรือเข็มยาว (นาที) เพื่อทดลองได้",set:"ครูตั้งเวลา",h:"ชั่วโมง",m:"นาที",setb:"ตั้งเวลา",rand:"สุ่มโจทย์",lvl:"ระดับ",rb:"สุ่มเวลา",showmin:"แสดงตัวเลขนาที (5, 10, 15…)",show:"เฉลย",hide:"ซ่อนเฉลย",
lv:["ตรงชั่วโมง","ครึ่งชั่วโมง","ทุก 15 นาที","ทุก 5 นาที","นาทีใดก็ได้"],
say:(h,m)=>m==0?`${h} นาฬิกาตรง`:`${h} นาฬิกา ${m} นาที`},
en:{title:"Reading an Analog Clock",hint:"Drag the short (hour) or long (minute) hand to try it.",set:"Teacher: set the time",h:"Hour",m:"Minute",setb:"Set clock",rand:"Random question",lvl:"Level",rb:"Random time",showmin:"Show minute numbers (5, 10, 15…)",show:"Show answer",hide:"Hide answer",
lv:["O'clock","Half hours","Every 15 min","Every 5 min","Any minute"],
say:(h,m)=>{const n=h%12+1,H=h;if(m==0)return `${H} o'clock`;if(m==15)return `quarter past ${H}`;if(m==30)return `half past ${H}`;if(m==45)return `quarter to ${n}`;return m<30?`${m} minute${m>1?"s":""} past ${H}`:`${60-m} minute${60-m>1?"s":""} to ${n}`}},
zh:{title:"看指针钟表读时间",hint:"拖动短针（时针）或长针（分针）来试试。",set:"老师设定时间",h:"时",m:"分",setb:"设定时间",rand:"随机出题",lvl:"难度",rb:"随机时间",showmin:"显示分钟数字（5、10、15…）",show:"看答案",hide:"隐藏答案",
lv:["整点","半点","每15分钟","每5分钟","任意分钟"],
say:(h,m)=>m==0?`${h}点整`:m==30?`${h}点半`:`${h}点${m}分`}
};
let lang="th",h=3,m=0,shown=false;
try{lang=localStorage.getItem("clockLang")||"th"}catch(e){}
if(!T[lang])lang="th";
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
function el(p,tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e)}
for(let i=0;i<60;i++){const big=i%5==0,r=i*Math.PI/30,s=Math.sin(r),c=-Math.cos(r),a=big?158:172;
 el($("ticks"),"line",{x1:200+s*a,y1:200+c*a,x2:200+s*180,y2:200+c*180,stroke:"var(--hour)","stroke-width":big?4:1.5})}
for(let i=1;i<=12;i++){const r=i*Math.PI/6;
 el($("nums"),"text",{x:200+Math.sin(r)*134,y:200-Math.cos(r)*134+13,"text-anchor":"middle","font-size":38,"font-weight":700,fill:"var(--hour)","font-family":"Mali,Sarabun,sans-serif"},i);
 el($("mnums"),"text",{x:200+Math.sin(r)*98,y:200-Math.cos(r)*98+6,"text-anchor":"middle","font-size":17,fill:"var(--min)","font-family":"Mali,Sarabun,sans-serif"},i*5)}
function draw(){
 $("hh").setAttribute("transform",`rotate(${(h%12+m/60)*30} 200 200)`);
 $("mh").setAttribute("transform",`rotate(${m*6} 200 200)`);
 $("inH").value=h;$("inM").value=m;
 const hh=h==0?12:h;
 $("digital").textContent=shown?`${hh}:${String(m).padStart(2,"0")}`:"?";
 $("say").textContent=shown?T[lang].say(hh,m):"";
 $("btnAns").textContent=shown?T[lang].hide:T[lang].show}
function setTime(nh,nm){h=((nh%12)+12)%12||12;if(h==12)h=12;m=Math.max(0,Math.min(59,nm|0));shown=false;draw()}
function tr(){const t=T[lang];document.documentElement.lang=lang;document.title=t.title;
 $("t_title").textContent=t.title;$("t_hint").textContent=t.hint;$("t_set").textContent=t.set;$("t_h").textContent=t.h;$("t_m").textContent=t.m;
 $("btnSet").textContent=t.setb;$("t_rand").textContent=t.rand;$("t_lvl").textContent=t.lvl;$("btnRand").textContent=t.rb;$("t_showmin").textContent=t.showmin;
 const v=$("lvl").value||"0";$("lvl").innerHTML=t.lv.map((x,i)=>`<option value="${i}">${x}</option>`).join("");$("lvl").value=v;
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==lang));draw()}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("clockLang",lang)}catch(e){}tr()});
$("btnSet").onclick=()=>setTime(parseInt($("inH").value)||12,parseInt($("inM").value)||0);
$("btnRand").onclick=()=>{const s=[60,30,15,5,1][+$("lvl").value],n=60/s;
 setTime(1+Math.floor(Math.random()*12),s==60?0:Math.floor(Math.random()*n)*s)};
$("btnAns").onclick=()=>{shown=!shown;draw()};
$("showMin").onchange=e=>$("mnums").style.display=e.target.checked?"":"none";
// drag hands
let drag=null;const svg=$("clock");
function pt(e){const r=svg.getBoundingClientRect(),k=400/r.width;return{x:(e.clientX-r.left)*k-200,y:(e.clientY-r.top)*k-200}}
svg.addEventListener("pointerdown",e=>{const p=pt(e);drag=Math.hypot(p.x,p.y)<110?"h":"m";svg.setPointerCapture(e.pointerId);move(e)});
svg.addEventListener("pointermove",e=>{if(drag)move(e)});
svg.addEventListener("pointerup",()=>drag=null);
function move(e){const p=pt(e);let a=Math.atan2(p.x,-p.y)*180/Math.PI;if(a<0)a+=360;
 if(drag=="m"){const nm=Math.round(a/6)%60;if(m>45&&nm<15)h=h%12+1;else if(m<15&&nm>45)h=(h+10)%12+1;m=nm}
 else{h=Math.floor(a/30)||12;if(h==0)h=12}
 shown=false;draw()}
tr();draw();
</script>
</body>
</html>
